<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <link rel="mask-icon" href="/favicon.svg" color="#0f172a" />

    <meta
      name="description"
      content="Subhash — Full Stack Java Developer. Portfolio, projects, and experience."
    />
    <meta name="theme-color" content="#0f172a" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#FFFCF8" media="(prefers-color-scheme: light)" />
    <meta name="color-scheme" content="light dark" />

    <title>Subhash · Full Stack Java Developer</title>

    <!-- ------------------------------------------------------------------ -->
    <!--  Font preload — eliminates FOIT/FOUT and improves CLS              -->
    <!--  Inter Variable is served by @fontsource-variable/inter.           -->
    <!--  Replace the hash with the actual built filename if it changes.    -->
    <!-- ------------------------------------------------------------------ -->
    <link
      rel="preload"
      href="/assets/inter-latin-wght-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin="anonymous"
    />

    <!-- ------------------------------------------------------------------ -->
    <!--  Resource hints — parallel DNS/TLS for likely next origins         -->
    <!-- ------------------------------------------------------------------ -->
    <link rel="dns-prefetch" href="https://formspree.io" />
    <link rel="preconnect" href="https://formspree.io" crossorigin="anonymous" />

    <!-- ------------------------------------------------------------------ -->
    <!--  Anti-FOUC theme bootstrap — runs before CSS/JS                    -->
    <!--  Kept inline and minimal so it costs ~0ms on the critical path.    -->
    <!-- ------------------------------------------------------------------ -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("portfolio-theme");
          var prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
          var theme =
            stored === "light" || stored === "dark"
              ? stored
              : prefersDark
                ? "dark"
                : "light";
          var root = document.documentElement;
          root.classList.toggle("dark", theme === "dark");
          root.style.colorScheme = theme;
          // Signal to CSS that we've already run — prevents transition flashes
          root.setAttribute("data-theme-ready", "true");
        } catch (_) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
